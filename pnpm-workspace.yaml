# Older pnpm 10 reads package.json#pnpm; keep those compatibility settings synchronized.
packages:
  - packages/*
autoInstallPeers: false
verifyDepsBeforeRun: false
supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - ia32
    - arm64
allowBuilds:
  esbuild: true
  koffi: true
  '@deepseek-ai/node-addon-system': true
  '@deepseek-ai/dsh-subprocess-local': true
  node-pty: false
  '@google/genai': false
  protobufjs: false
patchedDependencies:
  '@deepseek-ai/dsh-session@0.1.6-alpha.2': packages/dsh-plugin/compat/dsh-session-0.1.6-alpha.2.patch
  '@deepseek-ai/dsh-win32-process@0.1.6-alpha.2': packages/dsh-plugin/compat/dsh-win32-process-0.1.6-alpha.2.patch
packageExtensions:
  '@deepseek-ai/dsh-client-store@0.1.6-alpha.2':
    dependencies:
      zustand: ~4.4.7
      immer: ^10.1.1
  '@deepseek-ai/dsh-agent-loop@0.1.6-alpha.2':
    dependencies:
      '@deepseek-ai/dsh-session-persistence': 0.1.6-alpha.2
  '@deepseek-ai/dsh-client-ui-primitives@0.1.6-alpha.2':
    dependencies:
      react: ^18.2.0
      clsx: ^2.0.0
      diff: ^9.0.0
      react-dom: ^18.2.0
      anser: ^2.3.5
      katex: ^0.16.47
      micromark-core-commonmark: ^2.0.3
      micromark-util-character: ^2.1.1
      micromark-util-classify-character: ^2.0.1
      micromark-util-symbol: ^2.0.1
      micromark-util-types: ^2.0.2
      shiki: ^4.3.1
      '@shikijs/langs': ^4.3.1
      micromark-factory-space: ^2.0.1
      micromark-extension-math: ^3.1.0
      mdast-util-from-markdown: ^2.0.3
      mdast-util-gfm: ^3.1.0
      mdast-util-math: ^3.0.0
      micromark-extension-gfm: ^3.0.0
      micromark-util-sanitize-uri: ^2.0.1
      simple-icons: 16.31.0
