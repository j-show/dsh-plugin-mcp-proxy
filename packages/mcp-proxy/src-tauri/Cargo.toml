[package]
name = "mcp-proxy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 AND MIT"
publish = false

[[bin]]
name = "mcp-proxy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
sys-locale = "0.3"
sha2 = "0.10"
dunce = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
