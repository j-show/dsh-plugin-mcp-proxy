<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>mcp-proxy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="app-icon.png" alt=""><div><strong data-i18n="brand"></strong><small data-i18n="subtitle"></small></div></div>
    <nav><button id="nav-connections" class="nav active" data-i18n="connections"></button><button id="nav-mcps" class="nav" data-i18n="localMcps"></button></nav>
    <div class="sidebar-footer"><span id="service-state" role="status" data-i18n="starting"></span><button id="exit" class="quiet" data-i18n="exit"></button></div>
  </aside>
  <main>
    <div id="bootstrap-banner" class="notice" role="status"><span id="bootstrap-message"></span><button id="register-uri" class="quiet" data-i18n="retry" hidden></button></div>
    <section id="connections-page">
      <header><div><h1 data-i18n="connections"></h1><p data-i18n="connectionHint"></p></div></header>
      <div id="connections" class="rows"></div>
    </section>
    <section id="mcps-page" hidden>
      <header><div><h1 data-i18n="localMcps"></h1><p data-i18n="mcpHint"></p></div><button id="add-mcp" class="primary" data-i18n="addMcp"></button></header>
      <div id="mcps" class="rows"></div>
    </section>
    <footer><div><span data-i18n="workspace"></span><code id="workspace"></code></div><details><summary data-i18n="configPath"></summary><code id="settings-file"></code></details></footer>
  </main>
  <div id="toast" role="alert" aria-live="polite" hidden></div>
  <dialog id="mcp-dialog">
    <form id="mcp-form">
      <div class="dialog-title"><h2 data-i18n="addMcp"></h2><button id="close-dialog" type="button" class="quiet" data-i18n="close"></button></div>
      <label><span data-i18n="name"></span><input name="service" required pattern="[A-Za-z0-9_-]{1,32}" maxlength="32" autocomplete="off"><small data-i18n="nameHint"></small></label>
      <label><span data-i18n="transport"></span><select name="transport"><option value="stdio" data-i18n="stdio"></option><option value="streamable-http" data-i18n="http"></option><option value="sse" data-i18n="sse"></option></select></label>
      <div id="stdio-fields"><label><span data-i18n="command"></span><input name="command" autocomplete="off"><small data-i18n="commandHint"></small></label>
      <label><span data-i18n="args"></span><textarea name="args" rows="3" spellcheck="false"></textarea><small data-i18n="argsHint"></small></label></div>
      <div id="http-fields" hidden><label><span data-i18n="url"></span><input name="url" type="url" autocomplete="off"></label></div>
      <details><summary data-i18n="advanced"></summary>
        <label><span data-i18n="env"></span><textarea name="env" rows="2" spellcheck="false"></textarea></label>
        <label><span data-i18n="headers"></span><textarea name="headers" rows="2" spellcheck="false"></textarea></label>
        <label><span data-i18n="cwd"></span><input name="cwd" autocomplete="off"></label>
        <label><span data-i18n="roots"></span><textarea name="roots" rows="2" spellcheck="false"></textarea></label>
      </details>
      <div class="dialog-actions"><button id="cancel-mcp" type="button" class="secondary" data-i18n="cancel"></button><button id="save-mcp" type="submit" class="primary" data-i18n="save"></button></div>
    </form>
  </dialog>
  <script type="module" src="renderer.js"></script>
</body>
</html>
