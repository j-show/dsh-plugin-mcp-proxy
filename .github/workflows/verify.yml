name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install public locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check, package and test native products
        shell: pwsh
        run: ./scripts/verify.ps1 -Mode release
      - name: Retain verification and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.sha }}
          path: |
            .artifacts/ci/
            release/
          if-no-files-found: warn
          retention-days: 14
