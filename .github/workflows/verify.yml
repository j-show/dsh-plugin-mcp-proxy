name: Cross-platform verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mac_intel_runner:
        description: 'Optional Mac x64 runner label for retry; empty keeps Intel DMG deferred'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  shared:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      native_matrix: ${{ steps.native_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - run: pnpm install --frozen-lockfile
      - name: Select native validation scope
        id: native_matrix
        env:
          MCP_PROXY_MAC_INTEL_RUNNER: ${{ inputs.mac_intel_runner }}
        run: node --import tsx/esm scripts/ci-matrix.ts
      - run: pnpm build:shared
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dev:check
      - uses: actions/upload-artifact@v4
        with:
          name: shared-${{ github.sha }}
          include-hidden-files: true
          path: |
            .artifacts/shared/
            packages/*/modules/*/lib/
            packages/dsh-plugin/lib/
            .artifacts/ci/native-matrix.json
          if-no-files-found: error
          retention-days: 7
  package-manager:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        pnpm: ['11', '12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test scripts/pnpm-compat.spec.ts scripts/development.spec.ts
  native:
    needs: shared
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shared.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Install Rust targets
        run: rustup target add ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/mcp-proxy/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: shared-${{ github.sha }}
          path: .
      - run: pnpm ${{ matrix.build }}
      - run: pnpm test:rust
      - run: pnpm build:mcp-plugin
      - name: Verify installed package payload
        if: runner.os != 'Linux'
        run: pnpm test:installer --target ${{ matrix.target }}
      - name: Verify extracted Debian payload
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:installer --target linux
      - name: Verify Win32 installer independently
        if: runner.os == 'Windows'
        run: pnpm test:installer --target win-32
      - name: Test native product
        if: runner.os != 'Linux'
        run: pnpm test:product --target ${{ matrix.target }}
      - name: Test Linux native product on a real X server
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:product --target linux
      - name: Test the Win32 product independently
        if: runner.os == 'Windows'
        run: pnpm test:product --target win-32
      - name: Require the interactive Windows desktop
        if: runner.os == 'Windows'
        run: pnpm test:browser --preflight
      - name: Test both browsers and the Tauri lifecycle
        if: runner.os == 'Windows'
        run: pnpm test:browser --target win-64
      - name: Test the Win32 GUI with both browsers
        if: runner.os == 'Windows'
        run: pnpm test:browser --target win-32
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.target }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            .artifacts/ci/
            release/
          if-no-files-found: warn
          retention-days: 14
